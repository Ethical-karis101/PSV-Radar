<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSV-Radar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f6f4; color: #18312b; font: 1rem system-ui, sans-serif; }
    main { max-width: 48rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; }
    label { display: grid; gap: .4rem; }
    input, button { font: inherit; padding: .65rem; border: 1px solid #788d85; border-radius: .4rem; }
    button { background: #146350; color: white; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem; }
    .metrics > div { background: white; padding: 1rem; border-radius: .6rem; }
    dt { font-weight: 600; }
    dd { margin: .4rem 0 0; font-size: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>PSV-Radar</h1>
    <h2>Daily vehicle summary</h2>

    <form id="summary-form">
      <label>Vehicle ID <input name="vehicle_id" value="psv-journey-demo" required></label>
      <label>Date in Kenya <input name="day" type="date" value="2026-11-19" required></label>
      <button type="submit">Load summary</button>
    </form>

    <p id="status" role="status"></p>
    <dl class="metrics">
      <div><dt>Boardings</dt><dd id="boardings">–</dd></div>
      <div><dt>Alightings</dt><dd id="alightings">–</dd></div>
      <div><dt>Completed journeys</dt><dd id="journeys">–</dd></div>
      <div><dt>Expected revenue</dt><dd id="expected">–</dd></div>
      <div><dt>Declared collections</dt><dd id="declared">–</dd></div>
      <div><dt>Variance</dt><dd id="variance">–</dd></div>
    </dl>
  </main>

  <script>
    const form = document.querySelector("#summary-form");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const metrics = document.querySelectorAll(".metrics dd");
    const numbers = new Intl.NumberFormat("en-KE");

    function setMetric(id, value) {
      document.getElementById(id).textContent = value;
    }

    function formatKes(amount) {
      return `KSh ${numbers.format(amount)}`;
    }

    function formatVariance(amount) {
      if (amount === null) return "Unavailable";
      if (amount === 0) return formatKes(0);
      const label = amount < 0 ? "shortfall" : "above expected";
      return `${formatKes(Math.abs(amount))} ${label}`;
    }

    async function loadJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = new FormData(form);
      const vehicleId = values.get("vehicle_id").trim();

      for (const metric of metrics) metric.textContent = "–";

      if (!vehicleId) {
        status.textContent = "Enter a vehicle ID.";
        return;
      }

      const query = new URLSearchParams({
        vehicle_id: vehicleId,
        day: values.get("day"),
      });

      button.disabled = true;
      status.textContent = "Loading summary…";

      try {
        const [passengers, revenue] = await Promise.all([
          loadJson(`/events/summary?${query}`),
          loadJson(`/revenue/daily?${query}`),
        ]);

        setMetric("boardings", numbers.format(passengers.boardings));
        setMetric("alightings", numbers.format(passengers.alightings));
        setMetric("journeys", numbers.format(revenue.completed_journeys));
        setMetric("expected", formatKes(revenue.expected_revenue_kes));

        const declared = revenue.declared_collections_kes;
        setMetric("declared", declared === null ? "Not declared" : formatKes(declared));
        setMetric("variance", formatVariance(revenue.variance_kes));
        status.textContent = `Showing ${revenue.vehicle_id} on ${revenue.day}.`;
      } catch (error) {
        status.textContent = `Could not load the summary. ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
