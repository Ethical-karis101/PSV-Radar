<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSV-Radar | Operations overview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f5f4;
      color: #162d29;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    header {
      background: #123b33;
      color: #f4fff9;
      padding: 1.1rem max(1rem, calc((100% - 70rem) / 2));
      font-weight: 750;
    }
    main { max-width: 72rem; margin: auto; padding: 2rem 1rem 3rem; }
    h1, h2 { line-height: 1.2; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); margin: 0 0 1.25rem; }
    h2 { font-size: 1.15rem; margin: 0 0 1rem; }
    .panel, .metric {
      background: #fff;
      border: 1px solid #d9e4df;
      border-radius: .85rem;
      padding: 1rem;
    }
    fieldset {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: .75rem;
      border: 0;
      padding: 0;
      margin: 0;
      min-width: 0;
    }
    label { display: grid; gap: .3rem; font-size: .88rem; font-weight: 650; }
    input, button {
      font: inherit;
      border: 1px solid #809a91;
      border-radius: .45rem;
      min-height: 2.65rem;
      padding: .45rem .75rem;
    }
    input { max-width: 100%; }
    button { color: #164d3e; background: #fff; cursor: pointer; }
    button.primary { color: #fff; background: #146350; border-color: #146350; }
    button:disabled { opacity: .6; cursor: default; }
    :focus-visible { outline: 3px solid #ba6a15; outline-offset: 3px; }
    .status { min-height: 1.5rem; margin: .8rem 0; color: #415c53; }
    .metrics, .charts { display: grid; gap: .85rem; }
    .metrics {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr));
      margin: 0 0 .85rem;
    }
    .charts { grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
    dt { color: #415c53; font-size: .88rem; }
    dd { margin: .3rem 0 0; font-size: 1.45rem; font-weight: 750; }
    .bar-label { display: flex; justify-content: space-between; gap: .5rem; }
    .bar-track {
      height: .6rem;
      background: #e8efec;
      border-radius: 1rem;
      overflow: hidden;
      margin: .3rem 0 .9rem;
    }
    .bar-fill { width: 0; height: 100%; background: #168268; transition: width .2s; }
    .bar-fill.secondary { background: #537d9a; }
    .note { margin: .2rem 0 0; color: #415c53; font-size: .9rem; }
    @media (prefers-reduced-motion: reduce) {
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <header>PSV-Radar</header>
  <main>
    <h1>Operations overview</h1>

    <form id="filters" class="panel">
      <fieldset id="controls" aria-label="Report filters">
        <label>Vehicle ID <input name="vehicle_id" value="psv-starter-demo" required></label>
        <label>Date in Kenya <input name="day" type="date" value="2026-11-19" required></label>
        <button class="primary" type="submit">Load summary</button>
        <button type="button" data-offset="-1">Previous day</button>
        <button type="button" data-offset="1">Next day</button>
      </fieldset>
    </form>

    <p id="status" class="status" role="status"></p>

    <dl class="metrics">
      <div class="metric"><dt>Boardings</dt><dd id="boardings">–</dd></div>
      <div class="metric"><dt>Alightings</dt><dd id="alightings">–</dd></div>
      <div class="metric"><dt>Completed journeys</dt><dd id="journeys">–</dd></div>
      <div class="metric"><dt>Expected revenue</dt><dd id="expected">–</dd></div>
      <div class="metric"><dt>Declared collections</dt><dd id="declared">–</dd></div>
      <div class="metric"><dt>Revenue variance</dt><dd id="variance">–</dd></div>
    </dl>

    <div class="charts">
      <section class="panel" aria-labelledby="passenger-title">
        <h2 id="passenger-title">Passenger activity</h2>
        <div class="bar-label"><span>Boardings</span><strong id="boarding-value">–</strong></div>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill" id="boarding-bar"></div></div>
        <div class="bar-label"><span>Alightings</span><strong id="alighting-value">–</strong></div>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill secondary" id="alighting-bar"></div></div>
      </section>

      <section class="panel" aria-labelledby="revenue-title">
        <h2 id="revenue-title">Revenue comparison</h2>
        <div class="bar-label"><span>Expected</span><strong id="expected-value">–</strong></div>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill" id="expected-bar"></div></div>
        <div class="bar-label"><span>Declared</span><strong id="declared-value">–</strong></div>
        <div class="bar-track" aria-hidden="true"><div class="bar-fill secondary" id="declared-bar"></div></div>
        <p class="note">Expected revenue uses fares from saved completed journeys.</p>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("filters");
    const controls = document.getElementById("controls");
    const status = document.getElementById("status");
    const dateInput = form.elements.namedItem("day");
    const formatter = new Intl.NumberFormat("en-KE");
    const count = value => formatter.format(value);
    const kes = value => `KSh ${count(value)}`;

    function setText(id, value) {
      document.getElementById(id).textContent = value;
    }

    function formatVariance(value) {
      if (value === null) return "Unavailable";
      if (value === 0) return kes(0);
      const label = value < 0 ? "shortfall" : "above expected";
      return `${kes(Math.abs(value))} ${label}`;
    }

    function setBar(name, value, max, format) {
      setText(`${name}-value`, value === null ? "Not declared" : format(value));
      const width = max > 0 && value !== null ? 100 * value / max : 0;
      document.getElementById(`${name}-bar`).style.width = `${width}%`;
    }

    function clearReport() {
      for (const element of document.querySelectorAll(".metrics dd, .bar-label strong")) {
        element.textContent = "–";
      }
      for (const bar of document.querySelectorAll(".bar-fill")) {
        bar.style.width = "0%";
      }
    }

    async function readJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function loadReport() {
      if (controls.disabled || !form.reportValidity()) return;

      const vehicleId = form.elements.namedItem("vehicle_id").value.trim();
      if (!vehicleId) {
        status.textContent = "Enter a vehicle ID.";
        return;
      }

      const day = dateInput.value;
      const query = new URLSearchParams({ vehicle_id: vehicleId, day });
      clearReport();
      controls.disabled = true;
      status.textContent = "Loading report…";

      try {
        const [passengers, revenue] = await Promise.all([
          readJson(`/events/summary?${query}`),
          readJson(`/revenue/daily?${query}`),
        ]);

        const { boardings, alightings } = passengers;
        const {
          completed_journeys: journeys,
          expected_revenue_kes: expected,
          declared_collections_kes: declared,
          variance_kes: variance,
        } = revenue;

        setText("boardings", count(boardings));
        setText("alightings", count(alightings));
        setText("journeys", count(journeys));
        setText("expected", kes(expected));
        setText("declared", declared === null ? "Not declared" : kes(declared));
        setText("variance", formatVariance(variance));

        const passengerMax = Math.max(boardings, alightings);
        setBar("boarding", boardings, passengerMax, count);
        setBar("alighting", alightings, passengerMax, count);

        const revenueMax = Math.max(expected, declared ?? 0);
        setBar("expected", expected, revenueMax, kes);
        setBar("declared", declared, revenueMax, kes);
        status.textContent = `Showing ${vehicleId} on ${day} (Kenya time).`;
      } catch (error) {
        status.textContent = `Could not load the report (${error.message}).`;
      } finally {
        controls.disabled = false;
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      loadReport();
    });

    for (const button of form.querySelectorAll("[data-offset]")) {
      button.addEventListener("click", () => {
        if (!dateInput.reportValidity()) return;
        const day = new Date(`${dateInput.value}T00:00:00Z`);
        day.setUTCDate(day.getUTCDate() + Number(button.dataset.offset));
        dateInput.value = day.toISOString().split("T")[0];
        loadReport();
      });
    }

    loadReport();
  </script>
</body>
</html>
